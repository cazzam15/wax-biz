<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<title>Page Not Found — The Wax Biz</title>
<meta name="robots" content="noindex">
<link rel="preload" href="/assets/fonts/Jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/CormorantGaramond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root {
    --bg:#faf6ef; --card:#ffffff; --gold:#b8943a; --gold-light:#9a7a2c;
    --text:#3a3027; --text-dim:#756954;
    --cream:#2a2218; --cream-dim:#6b5f4d; --border:rgba(184,148,58,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Jost',sans-serif; font-weight:300;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
  }
  .wrap { max-width:520px; }
  .code {
    font-family:'Cormorant Garamond',serif; font-weight:300;
    font-size:7rem; line-height:1; color:var(--gold);
  }
  h1 {
    font-family:'Cormorant Garamond',serif; font-weight:400;
    font-size:2rem; margin:1rem 0 0.75rem; color:var(--gold-light);
  }
  p { color:var(--text-dim); font-size:1.05rem; line-height:1.6; margin-bottom:2rem; }
  a.btn {
    display:inline-block; text-decoration:none;
    border:1px solid var(--gold); color:var(--gold);
    padding:0.75rem 2rem; letter-spacing:0.08em; text-transform:uppercase;
    font-size:0.85rem; transition:all 0.25s ease;
  }
  a.btn:hover { background:var(--gold); color:#2a2218; }
  nav{text-align:left;position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 3rem;background:rgba(250,246,239,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:500;color:var(--gold-light);letter-spacing:0.08em;text-decoration:none}
  .nav-links{display:flex;gap:2.5rem;list-style:none}
  .nav-links a{color:var(--cream-dim);text-decoration:none;font-size:0.78rem;letter-spacing:0.15em;text-transform:uppercase;transition:color 0.3s}
  .nav-links a:hover,.nav-links a.active{color:var(--gold-light)}
  @media(max-width:768px){nav{padding:1rem 1.5rem}.nav-links{display:none}}
  /* ── Tools dropdown ── */
  .nav-sub-wrap{position:relative}
  .nav-sub-toggle{font:inherit;background:none;border:none;padding:0;cursor:pointer;color:var(--cream-dim);font-size:0.78rem;letter-spacing:0.15em;text-transform:uppercase;transition:color 0.3s;display:inline-flex;align-items:center;gap:0.5rem;line-height:inherit}
  .nav-sub-toggle::after{content:'';width:5px;height:5px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform 0.3s}
  .nav-sub-wrap.open .nav-sub-toggle::after{transform:translateY(1px) rotate(-135deg)}
  .nav-sub-toggle:hover,.nav-sub-toggle.active,.nav-sub-wrap.open .nav-sub-toggle{color:var(--gold-light)}
  .nav-sub-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .nav-sub{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:1.4rem;z-index:101}
  .nav-sub ul{list-style:none;background:var(--bg);border:1px solid var(--border);box-shadow:0 12px 24px rgba(42,34,24,0.08);min-width:240px;padding:0.4rem 0}
  .nav-sub a{display:block;padding:0.6rem 1.2rem;white-space:nowrap}
  .nav-sub a[aria-current=page]{color:var(--gold-light)}
  .nav-sub-wrap.open .nav-sub{display:block}
  @media(hover:hover) and (min-width:769px){.nav-sub-wrap:hover .nav-sub{display:block}}
  @media(max-width:768px){
    .nav-sub-toggle{display:flex;width:100%;justify-content:space-between;padding:0.85rem 0;font-size:0.82rem;border-bottom:1px solid var(--border)}
    .nav-sub{position:static;transform:none;padding:0}
    .nav-sub ul{border:none;box-shadow:none;min-width:0;padding:0 0 0 1rem;background:none}
    nav .nav-links .nav-sub a,nav .nav-links .nav-sub li:last-child a{padding:0.75rem 0;border-bottom:1px solid var(--border)}
  }
  /* ── Mobile menu ── */
  .nav-toggle{display:none}
  @media(max-width:768px){
    .nav-toggle{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:44px;height:44px;background:none;border:1px solid var(--border);color:var(--gold-light);cursor:pointer;padding:0}
    .nav-toggle span{display:block;width:20px;height:1.5px;background:currentColor;transition:transform 0.3s,opacity 0.3s}
    .nav-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    nav.nav-open .nav-toggle span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
    nav.nav-open .nav-toggle span:nth-child(2){opacity:0}
    nav.nav-open .nav-toggle span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
    nav .nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--border);padding:0.5rem 1.5rem 1rem;box-shadow:0 12px 24px rgba(42,34,24,0.08)}
    nav.nav-open .nav-links{display:flex}
    nav .nav-links a{display:block;padding:0.85rem 0;font-size:0.82rem;border-bottom:1px solid var(--border)}
    nav .nav-links li:last-child a{border-bottom:none}
  }
</style>
</head>
<body>
<nav>
  <a href="/index.html" class="nav-logo">The Wax Biz</a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="site-nav">
    <li><a href="/index.html#retailers">Retailers</a></li>
    <li><a href="/index.html#guides">Buying Guides</a></li>
    <li class="nav-sub-wrap">
      <button type="button" class="nav-sub-toggle" aria-expanded="false" aria-controls="tools-menu">Tools</button>
      <div class="nav-sub" id="tools-menu"><ul>
        <li><a href="/fragrance-load-calculator.html">Fragrance Load Calculator</a></li>
        <li><a href="/wax-melt-pricing-calculator.html">Pricing Calculator</a></li>
      </ul></div>
    </li>
    <li><a href="/amazon-picks.html">Amazon Picks</a></li>
  </ul>
</nav>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This wick won't light</h1>
    <p>The page you're looking for has melted away. Let's get you back to the supplies directory.</p>
    <a class="btn" href="/">Back to The Wax Biz</a>
  </div>
<script>
  // ── Mobile menu + Tools dropdown ──
  (function () {
    var nav = document.querySelector('nav');
    var btn = nav && nav.querySelector('.nav-toggle');
    if (!btn) return;
    var sub = nav.querySelector('.nav-sub-wrap');
    var subBtn = sub && sub.querySelector('.nav-sub-toggle');
    function setSub(open) {
      if (!sub) return;
      sub.classList.toggle('open', open);
      subBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    function setOpen(open) {
      nav.classList.toggle('nav-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      if (!open) setSub(false);
    }
    btn.addEventListener('click', function () { setOpen(!nav.classList.contains('nav-open')); });
    if (subBtn) {
      subBtn.addEventListener('click', function () { setSub(!sub.classList.contains('open')); });
      sub.addEventListener('focusout', function (e) {
        if (!nav.classList.contains('nav-open') && !sub.contains(e.relatedTarget)) setSub(false);
      });
    }
    nav.querySelectorAll('.nav-links a').forEach(function (a) {
      a.addEventListener('click', function () { setOpen(false); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (sub && sub.classList.contains('open')) { setSub(false); subBtn.focus(); }
      else if (nav.classList.contains('nav-open')) { setOpen(false); btn.focus(); }
    });
    document.addEventListener('click', function (e) {
      if (!nav.contains(e.target)) setOpen(false);
      else if (sub && !sub.contains(e.target)) setSub(false);
    });
    window.matchMedia('(min-width: 769px)').addEventListener('change', function (m) { if (m.matches) setOpen(false); });
  })();
</script>
</body>
</html>
